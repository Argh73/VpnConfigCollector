name: Update Collector

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "*/43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: Files/go.mod

      - name: Install dependencies
        run: |
          cd Files
          go mod tidy

      - name: Build and run Go aggregator
        run: |
          cd Files
          go build -ldflags="-s -w" -o ../aggregator *.go
          cd ..
          ./aggregator
          rm -f aggregator

      - name: Verify output files
        run: |
          echo "=== Root files ==="
          ls -la *.txt 2>/dev/null || echo "No root txt"
          echo "=== Base64 ==="
          ls -la Base64/ 2>/dev/null || true
          echo "=== Protocol ==="
          ls -la Splitted-By-Protocol/ 2>/dev/null || true
          echo "=== Country ==="
          ls -la Splitted-By-Country/ 2>/dev/null || true

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          # اگر تغییری نبود، commit نمی‌کند ولی workflow موفق می‌ماند (سبز)
          git commit -m "🏴‍☠️ Fresh Update $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
