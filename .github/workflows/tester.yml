name: Auto V2Ray Tester

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r Files/tester/requirements.txt requests

      - name: Download Xray
        run: |
          cd Files/tester
          mkdir -p xray-linux-64
          cd xray-linux-64
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o Xray-linux-64.zip
          chmod +x xray

      - name: Run Tester
        run: |
          cd Files/tester
          timeout 12m python headless_runner.py || echo "Finished with timeout or completed"

      - name: Commit & Push to Main Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add tested/test.txt 2>/dev/null || true
          git add tested/working.txt 2>/dev/null || true
          
          if git diff --cached --name-only | grep -q "tested/"; then
            git commit -m "Auto Update: Tested configs $(date -u)"
            
            git pull --rebase origin main
            
            git push origin HEAD:main
            echo "✅ tested/test.txt pushed successfully to main repository"
          else
            echo "No changes in tested/ to commit"
          fi
