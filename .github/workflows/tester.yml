name: Auto V2Ray Tester

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r Files/tester/requirements.txt requests

      - name: Download Xray
        run: |
          cd Files/tester
          mkdir -p xray-linux-64
          cd xray-linux-64
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o Xray-linux-64.zip
          chmod +x xray

      - name: Run Tester
        run: |
          cd Files/tester
          timeout 12m python headless_runner.py || echo "Finished with timeout or completed"

      - name: Process Output and Move to tested/
        run: |
          mkdir -p tested
          
          if [ -f Files/tester/Test.txt ]; then
            mv Files/tester/Test.txt tested/test.txt
          elif [ -f Files/tester/test.txt ]; then
            mv Files/tester/test.txt tested/test.txt
          fi
          
          if [ -f Files/tester/working.txt ]; then
            mv Files/tester/working.txt tested/working.txt
          fi

      - name: Commit & Push to Main Repo
        run: |
          git config user.name "github-actions
